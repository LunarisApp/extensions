name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  registry:
    runs-on: ubuntu-latest
    outputs:
      curated: ${{ steps.curated.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - working-directory: registry
        run: bun install --frozen-lockfile
      - working-directory: registry
        run: bun test
      - working-directory: registry
        run: bun run typecheck
      - working-directory: registry
        run: bun run check
      - id: curated
        run: echo "matrix=$(bun registry/discover-curated.ts)" >> "$GITHUB_OUTPUT"

  create-extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: create-extension
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: |
          if bun -e 'process.exit(require("./package.json").scripts?.test ? 0 : 1)'; then bun run test; fi
      - run: bun run typecheck
      - run: bun run check
      - run: bun run build
      - run: npm pack --dry-run

  curated-extensions:
    needs: registry
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJSON(needs.registry.outputs.curated) }}
    defaults:
      run:
        working-directory: ${{ matrix.root }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: |
          if bun -e 'process.exit(require("./package.json").scripts?.test ? 0 : 1)'; then bun run test; fi
      - run: bun run typecheck
      - run: bun run build
      - env:
          EXTENSION_ARTIFACTS_ROOT: ${{ github.workspace }}/artifacts
          EXTENSION_EXPECTED_ID: ${{ matrix.id }}
          EXTENSION_EXPECTED_VERSION: ${{ matrix.version }}
          EXTENSION_REPOSITORY: LunarisApp/extensions
        run: bun ../../registry/build-artifact.ts --check
