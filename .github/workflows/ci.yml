name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: delivery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  registry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      curated: ${{ steps.curated.outputs.matrix }}
      pending: ${{ steps.curated.outputs.pending }}
      enabled: ${{ steps.curated.outputs.enabled }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: create-extension/package.json
      - working-directory: registry
        run: bun install --frozen-lockfile
      - working-directory: registry
        run: bun test
      - working-directory: registry
        run: bun run typecheck
      - working-directory: registry
        run: bun run check
      - name: Verify published catalog integrity and policy
        run: |
          bun registry/verify-artifacts.ts
          bun registry/update-marketplace.ts
      - name: Enforce immutable published artifacts
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=$(git diff --name-only "$BASE_SHA" HEAD -- artifacts)
          if [ -n "$changed" ]; then
            echo "Artifacts are generated by CD; change source and bump the extension version."
            echo "$changed"
            exit 1
          fi
      - id: curated
        run: bun registry/release-plan.ts

  create-extension:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: create-extension
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: create-extension/package.json
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run typecheck
      - run: bun run check
      - run: bun run build
      - run: npm pack --dry-run

  curated-extensions:
    needs: registry
    if: needs.registry.outputs.enabled != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.registry.outputs.curated) }}
    defaults:
      run:
        working-directory: ${{ matrix.root }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: create-extension/package.json
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run typecheck
      - run: bun run build
      - name: Install artifact tooling
        working-directory: registry
        run: bun install --frozen-lockfile
      - name: Validate release bundle
        env:
          EXTENSION_ARTIFACTS_ROOT: ${{ runner.temp }}/extension-artifacts
          EXTENSION_EXPECTED_ID: ${{ matrix.id }}
          EXTENSION_EXPECTED_VERSION: ${{ matrix.version }}
          EXTENSION_REPOSITORY: ${{ github.repository }}
        run: bun ../../registry/build-artifact.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.publish && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: release-${{ matrix.id }}
          overwrite: true
          path: ${{ runner.temp }}/extension-artifacts/
          if-no-files-found: error
          retention-days: 7

  ci:
    name: CI
    if: always()
    needs: [registry, create-extension, curated-extensions]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every validation job
        env:
          REGISTRY: ${{ needs.registry.result }}
          CREATOR: ${{ needs.create-extension.result }}
          EXTENSIONS: ${{ needs.curated-extensions.result }}
          ENABLED: ${{ needs.registry.outputs.enabled }}
        run: |
          test "$REGISTRY" = success
          test "$CREATOR" = success
          if [ "$ENABLED" = 0 ]; then
            test "$EXTENSIONS" = skipped
          else
            test "$EXTENSIONS" = success
          fi

  publish:
    name: Publish marketplace
    needs: [ci, registry]
    if: always() && needs.ci.result == 'success' && needs.registry.result == 'success' && github.repository == 'LunarisApp/extensions' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Check source is still main
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$SOURCE_SHA" || {
            echo "main advanced; let the newer run publish, or dispatch CI on current main."
            exit 1
          }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: create-extension/package.json
      - working-directory: registry
        run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.registry.outputs.pending != '0'
        with:
          pattern: release-*
          path: ${{ runner.temp }}/release-input
          merge-multiple: true
      - name: Commit artifacts and pinned index, then publish
        env:
          SOURCE_SHA: ${{ github.sha }}
          MARKETPLACE_REPOSITORY: ${{ github.repository }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          bun registry/publish.ts "$RUNNER_TEMP/release-input" "$SOURCE_SHA"
          git push origin HEAD:refs/heads/main
          printf 'Published marketplace commit: %s\n\nValidated source: %s\n' "$(git rev-parse HEAD)" "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
