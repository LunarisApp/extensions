name: Extension registry smoke test

on:
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - working-directory: registry
        run: bun install --frozen-lockfile
      - env:
          REGISTRY_SMOKE_URL: https://plugins.lunaris.app
        run: bun registry/smoke.ts
