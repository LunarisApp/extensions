name: Plugin registry

on:
  push:
    branches: [main]
    paths:
      - "plugins/**"
      - "registry/**"
      - ".github/workflows/plugin-registry.yml"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      allow_flagged:
        description: Publish security-flagged community builds after review
        required: false
        type: boolean
        default: false

concurrency:
  group: plugin-registry-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      community: ${{ steps.community.outputs.matrix }}
      curated: ${{ steps.curated.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - working-directory: registry
        run: bun install --frozen-lockfile
      - id: curated
        run: echo "matrix=$(bun registry/discover-curated.ts)" >> "$GITHUB_OUTPUT"
      - id: community
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: echo "matrix=$(bun registry/discover-community.ts)" >> "$GITHUB_OUTPUT"

  build-curated:
    needs: discover
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.curated) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - working-directory: registry
        run: bun install --frozen-lockfile
      - working-directory: ${{ matrix.root }}
        run: bun install --frozen-lockfile
      - working-directory: ${{ matrix.root }}
        run: |
          if bun -e 'process.exit(require("./package.json").scripts?.test ? 0 : 1)'; then bun run test; fi
          bun run typecheck
          bun audit --production
          bun run build
      - env:
          PLUGIN_DIST: ${{ matrix.root }}/dist
          PLUGIN_EXPECTED_ID: ${{ matrix.id }}
          PLUGIN_EXPECTED_VERSION: ${{ matrix.version }}
          PLUGIN_REPOSITORY: ${{ matrix.repository }}
        run: bun registry/stage-build.ts
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-curated-${{ matrix.id }}-${{ matrix.version }}
          path: ${{ matrix.root }}/dist
          if-no-files-found: error

  build-community:
    needs: discover
    if: ${{ needs.discover.outputs.community != '{"include":[]}' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.community) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          repository: ${{ matrix.repository }}
          ref: refs/tags/${{ matrix.tag }}
          path: plugin-source
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - working-directory: registry
        run: bun install --frozen-lockfile
      - working-directory: plugin-source
        run: bun install --frozen-lockfile --ignore-scripts
      - working-directory: plugin-source
        run: bun test --pass-with-no-tests && bun run typecheck
      - working-directory: plugin-source
        run: bun audit --production || touch registry-audit-flagged
      - working-directory: registry
        env:
          PLUGIN_EXPECTED_ID: ${{ matrix.id }}
          PLUGIN_RELEASE_TAG: ${{ matrix.tag }}
          PLUGIN_ROOT: ../plugin-source
        run: bunx --bun vite build --config vite.config.mts
      - working-directory: plugin-source
        run: if [ -f registry-audit-flagged ]; then cp registry-audit-flagged dist/; fi
      - env:
          PLUGIN_DIST: plugin-source/dist
          PLUGIN_EXPECTED_ID: ${{ matrix.id }}
          PLUGIN_EXPECTED_VERSION: ${{ matrix.tag }}
          PLUGIN_REPOSITORY: ${{ matrix.repository }}
        run: bun registry/stage-build.ts
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-community-${{ matrix.id }}-${{ matrix.tag }}
          path: plugin-source/dist
          if-no-files-found: error

  publish:
    needs: [discover, build-curated, build-community]
    if: >-
      ${{ always() &&
          needs.discover.result == 'success' &&
          needs.build-curated.result == 'success' &&
          (needs.build-community.result == 'success' || needs.build-community.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - working-directory: registry
        run: bun install --frozen-lockfile
      - id: pages-branch
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.pages-branch.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: registry-site
      - if: steps.pages-branch.outputs.exists == 'false'
        run: |
          mkdir registry-site
          git -C registry-site init --initial-branch=gh-pages
          git -C registry-site remote add origin "$(git remote get-url origin)"
      - uses: actions/download-artifact@v4
        with:
          pattern: plugin-*
          path: plugin-artifacts
      - env:
          ALLOW_FLAGGED: ${{ inputs.allow_flagged || false }}
          PLUGIN_ARTIFACTS_DIR: plugin-artifacts
          REGISTRY_BASE_URL: https://plugins.lunaris.app
          REGISTRY_SITE_DIR: registry-site
        run: bun registry/publish.ts
      - id: commit
        run: |
          git -C registry-site config user.name "github-actions[bot]"
          git -C registry-site config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C registry-site add -A
          if git -C registry-site diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git -C registry-site commit -m "Publish plugin registry"
            gh auth setup-git
            git -C registry-site push origin HEAD:gh-pages
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - run: rsync -a --exclude .git registry-site/ pages-upload/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: pages-upload

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy registry
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - working-directory: registry
        run: bun install --frozen-lockfile
      - name: Verify deployed registry
        env:
          REGISTRY_ASSET_ORIGIN_OVERRIDE: ${{ steps.deployment.outputs.page_url }}
          REGISTRY_SMOKE_URL: ${{ steps.deployment.outputs.page_url }}
        run: bun registry/smoke.ts
